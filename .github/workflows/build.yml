name: build

on:
  push:
    branches: [ main, update-1.4 ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build (tools downloaded + hash-checked by build.ps1)
        shell: pwsh
        run: ./build.ps1 -DownloadTools

      - name: Upload dist
        uses: actions/upload-artifact@v6
        with:
          name: move-window-between-desktops-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14